id: 150
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się przez 15 sekund stać na palcach jednej nogi, utrzymując na głowie puste pudełko od gry?
    (2 próby)
    Gracz nie może podtrzymywać pudełka ręką (ani niczym innym).
  en: |-
    Will the player manage to stand on the toes of one foot for 15 seconds while balancing an empty game box on their head?
    (2 attempts)
    The player may not support the box with a hand (or with anything else).
timeLimit: QUARTER_MINUTE