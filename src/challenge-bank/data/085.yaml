id: 85
type: MENTAL
content:
  pl: |-
    Czy gracz odgadnie, o którego polskiego aktora chodzi, zadając 10 pytań, na które można odpowiedzieć tylko „tak” lub „nie”?
    Pozostali gracze powinni uzgodnić nazwisko aktora przed obstawianiem.
  en: |-
    Will the player guess which Polish actor it is by asking 10 questions that can only be answered 'yes' or 'no'?
    The other players should agree on the name of the actor before placing bets.
timeLimit: NONE