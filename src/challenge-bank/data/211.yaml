id: 211
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się w 30 sekund podnieść długopis palcami stopy i unieść go tak wysoko, żeby chwycić go zębami?
    Gracz siedzi na podłodze. Rękami wolno trzymać nogę, ale nie długopis.
  en: |-
    Will the player manage to pick up a pen with their toes and lift it high enough to grab it with their teeth within 30 seconds?
    The player sits on the floor. Hands may hold the leg, but not the pen.
timeLimit: HALF_MINUTE
