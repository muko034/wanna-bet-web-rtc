content:
  pl: |-
    Czy graczowi uda się w ciągu 1 minuty 30 razy przejść z pozycji stojącej w rozkroku z rękami uniesionymi nad głowę do przykucu z rękami dotykającymi podłogi i z powrotem?
  en: |-
    Will the player manage to go 30 times within 1 minute from a standing straddle position with arms raised above their head to a squat with hands touching the floor and back?
