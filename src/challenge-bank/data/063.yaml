id: 63
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się stać przez 30 sekund na palcach lewej nogi z zamkniętymi oczami?
    Prawa noga musi być w powietrzu.
  en: |-
    Will the player manage to stand on the toes of their left foot with their eyes closed for 30 seconds?
    The right leg must be in the air.
