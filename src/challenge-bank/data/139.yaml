id: 139
type: MENTAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 30 sekund powiedzieć od tyłu jedno z poniższych słów?
    Pozostali gracze wybierają jedno z poniższych słów przed fazą obstawiania.
    Gracz nie może korzystać z długopisu ani kartki.
    ELEKTROMAGNETYZM
    NIESYMETRYCZNOŚĆ
    NIEWYPOWIEDZIANY
  en: |-
    Will the player manage to say one of the words below backwards in 30 seconds?
    The other players choose one of the words below before the betting phase.
    The player may not use a pen or paper.
    ELECTROMAGNETISM
    ASYMMETRY
    UNSPEAKABLE
timeLimit: HALF_MINUTE