id: 105
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się zrobić 30 brzuszków w ciągu 1 minuty?
    Podczas brzuszków ręce gracza powinny być nieruchome, splecione za głową lub na klatce piersiowej.
  en: |-
    Will the player manage to do 30 sit-ups in 1 minute?
    During the sit-ups, the player's hands should stay still, clasped behind the head or on the chest.
timeLimit: ONE_MINUTE