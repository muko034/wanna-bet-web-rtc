id: 60
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się balansować na palcu butelką wypełnioną do połowy płynem przez 15 sekund?
    Należy użyć 1,5-litrowej plastikowej butelki.
  en: |-
    Will the player manage to balance a bottle half-filled with liquid on their finger for 15 seconds?
    Use a 1.5-liter plastic bottle.
timeLimit: QUARTER_MINUTE