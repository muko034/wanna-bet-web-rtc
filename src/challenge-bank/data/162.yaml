id: 162
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się wrzucić piłeczkę pingpongową do leżącego na podłodze pudełka od gry, tak aby piłeczka przed wpadnięciem do pudełka odbiła się 2 razy od podłoża?
    (3 udane próby z 5)
    Piłeczka może wypaść z pudełka, ale musi się w nim najpierw znaleźć.
  en: |-
    Will the player manage to throw a ping pong ball into the game box lying on the floor so that the ball bounces off the floor twice before it lands in the box?
    (3 successful attempts out of 5)
    The ball may fall out of the box, but it must land in the box first.
timeLimit: NONE