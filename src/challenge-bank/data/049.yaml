id: 49
type: MENTAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 1 minuty podać 8 nowych słów z liter jednego z poniższych słów?
    (gracz ma kartkę i długopis)
    Słowo wybiera gracz siedzący po lewej stronie gracza.
    Nowe słowa muszą być prawdziwymi słowami. Każdej litery można użyć najwyżej tyle razy, ile razy występuje w wybranym słowie.
    KSIĘSTWO
    ODPOWIEDNI
    SAMOTNOŚĆ
    ŚWIADECTWO
  en: |-
    Will the player manage to name 8 new words in 1 minute using the letters of one of the words below?
    (the player has a sheet of paper and a pen)
    The player sitting to the left of the player chooses the word.
    The new words must be real words. Each letter may be used at most as many times as it appears in the chosen word.
    COMMUNICATION
    APPROPRIATE
    CELEBRATION
    HOSPITALITY
timeLimit: ONE_MINUTE