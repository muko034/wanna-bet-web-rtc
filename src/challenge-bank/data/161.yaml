id: 161
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się wrzucić piłeczkę pingpongową do pudełka od gry leżącego na krześle tak, aby przed wpadnięciem do pudełka odbiła się raz od podłogi?
    (3 udane próby z 5)
    Piłeczka może wypaść z pudełka, ale najpierw musi do niego wpaść.
  en: |-
    Will the player manage to throw a ping pong ball into a game box lying on a chair so that the ball bounces once off the floor before it lands in the box?
    (3 successful attempts out of 5)
    The ball may fall out of the box, but it must land in it first.
timeLimit: NONE