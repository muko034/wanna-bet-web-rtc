id: 47
type: MENTAL
content:
  pl: |-
    Czy graczowi uda się zapamiętać 8-elementową kombinację liter "X" i "Y", którą jeden z pozostałych graczy napisze na kartce?
    (Przykład: XXYYXXYY)
    Gracz może patrzeć na kartkę przez 15 sekund.
  en: |-
    Will the player manage to remember an 8-element combination of the letters "X" and "Y" that one of the other players writes on a piece of paper?
    (Example: XXYYXXYY)
    The player can look at the paper for 15 seconds.
timeLimit: QUARTER_MINUTE