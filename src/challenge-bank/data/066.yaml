content:
  pl: |-
    Czy graczowi uda się zakręcić monetą tak, aby kręciła się przez co najmniej 15 sekund?
    (2 próby)
    Odliczanie należy przerwać, gdy moneta całkowicie znieruchomieje.
  en: |-
    Will the player manage to spin a coin so that it keeps spinning for at least 15 seconds?
    (2 attempts)
    Stop the countdown when the coin comes to a complete stop.
