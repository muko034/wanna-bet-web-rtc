id: 176
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się zrobić 10 przysiadów z książką na głowie?
    Książka nie może spaść. Gracz nie może jej przytrzymywać rękami.
  en: |-
    Will the player manage to do 10 squats with a book on their head?
    The book cannot fall.
    The player cannot hold it with their hands.
timeLimit: NONE