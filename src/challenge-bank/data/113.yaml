id: 113
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się utrzymać w palcach zapaloną zapałkę przez 30 sekund?
    Jeśli zapałka zgaśnie, próba jest nieudana.
  en: |-
    Will the player manage to hold a lit match in their fingers for 30 seconds?
    If the match goes out, the attempt is unsuccessful.
timeLimit: HALF_MINUTE