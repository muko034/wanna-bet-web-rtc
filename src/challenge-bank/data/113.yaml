id: 113
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się utrzymać w placach przez 30 sekund zapaloną zapałkę.
    Jeśli zapałka zgaśnie próba jest nieudana.
  en: |-
    Will the player manage to keep a lit match in place for 30 seconds?
    If the match goes out, the attempt is unsuccessful.
timeLimit: HALF_MINUTE