id: 154
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się skoczyć na lewej nodze na odległość 1 metra bez potknięcia się?
    (3 udane próby z 5)
    Skok musi się zacząć i skończyć na lewej nodze. Dodatkowo gracz musi wylądować w miejscu, bez podskoków czy podpierania się.
  en: |-
    Will the player manage to jump 1 meter on their left leg without stumbling?
    (3 successful attempts out of 5)
    The jump must start and end on the left leg. The player must also land steadily, without extra hops or leaning on anything.
timeLimit: NONE