id: 17
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się, siadając na podłodze i wstając, utrzymać kostkę do gry na zewnętrznej powierzchni dłoni?
    Gracz musi usiąść i wstać 3 razy.
  en: |-
    Will the player manage to keep a die on the back of their hand while sitting down on the floor and standing up?
    The player must sit down and stand up 3 times.
timeLimit: NONE