id: 13
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się zetknąć palce obu dłoni za plecami, sięgając jedną ręką od góry przez ramię, a drugą od dołu?
  en: |-
    Will the player manage to touch the fingers of both hands behind their back, reaching one hand over the shoulder from above and the other from below?
timeLimit: NONE