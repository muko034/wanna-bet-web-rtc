id: 133
type: MENTAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 1 minuty ułożyć 5 innych słów z liter podanego słowa?
    Pozostali gracze przed fazą obstawiania wybierają jedno z poniższych słów (lub inne).
    Gracz może korzystać z kartki i długopisu.
    WIELKANOC
    AKTORKA
    SKRZYŻOWANIE
  en: |-
    Will the player manage to make 5 other words from the letters of the given word within 1 minute?
    Before the betting phase, the other players choose one of the words below (or another word).
    The player may use a piece of paper and a pen.
    EASTER
    ACTRESS
    INTERSECTION
timeLimit: ONE_MINUTE