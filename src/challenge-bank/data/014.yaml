id: 14
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się pstryknąć kostkę do gry z jednego końca stołu tak, aby zatrzymała się na stole nie dalej niż 30 cm od jego drugiej krawędzi?
    (3 udane próby z 6)
  en: |-
    Will the player manage to flick a die from one end of the table so that it stops on the table no more than 30 cm from the other edge?
    (3 successful attempts out of 6)
timeLimit: NONE