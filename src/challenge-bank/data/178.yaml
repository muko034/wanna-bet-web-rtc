content:
  pl: |-
    Czy graczowi uda się bezbłędnie napisać tekst składający się z 10-15 słów, który podyktuje mu jeden z pozostałych graczy?
  en: |-
    Will the player manage to write, without any mistakes, a text of 10-15 words that one of the other players dictates to them?
