id: 121
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się złapać chusteczkę lub banknot, zanim spadnie na podłogę?
    Jeden z pozostałych graczy, stojąc na krześle z ręką wyciągniętą ponad głowę, upuszcza chusteczkę lub banknot.
  en: |-
    Will the player manage to catch a tissue or banknote before it falls to the floor?
    One of the other players, standing on a chair with their hand stretched above their head, drops the tissue or banknote.
timeLimit: NONE