id: 65
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 1 minuty wymienić przynajmniej 3 rzeczy, które ma na sobie gracz siedzący po jego prawej stronie, wraz z ich kolorami?
    (gracz zamyka oczy, zanim zadanie zostanie odczytane, i nie otwiera ich do końca zadania)
  en: |-
    Will the player manage to name, within 1 minute, at least 3 items that the player sitting on their right is wearing, with their colors?
    (the player closes their eyes before the task is read and keeps them closed until the end)
timeLimit: ONE_MINUTE