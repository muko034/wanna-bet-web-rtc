id: 25
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się wrzucić długopis do kubka leżącego w odległości ok. 1 metra?
    (4 próby)
    Długopis musi pozostać w kubku – nie może z niego wypaść.
  en: |-
    Will the player manage to throw a pen into a cup placed about 1 meter away?
    (4 attempts)
    The pen must stay in the cup and must not fall out.
timeLimit: NONE