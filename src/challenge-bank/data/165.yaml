id: 165
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się wykonać pełen obrót, stojąc na jednej nodze i nie tracąc równowagi?
    (2 udane próby z 3)
    Gracz nie może podskakiwać na nodze, na której wykonuje obrót.
    Po obrocie gracz musi utrzymać równowagę na jednej nodze.
  en: |-
    Will the player manage to complete a full turn while standing on one leg without losing their balance?
    (2 successful attempts out of 3)
    The player may not hop on the leg they turn on.
    After the turn, the player must keep their balance on one leg.
timeLimit: NONE