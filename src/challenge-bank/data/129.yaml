id: 129
type: MENTAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 1 minuty zapamiętać 2 kontakty (nazwa i numer) z telefonu jednego z pozostałych graczy, a potem podać je z pamięci?
    Przed obstawianiem pozostali gracze wybierają 2 kontakty z tego telefonu.
  en: |-
    Will the player manage to memorize 2 contacts (name and number) from the phone of one of the other players in 1 minute, and then recite them from memory?
    Before placing bets, the other players choose 2 contacts from that phone.
timeLimit: ONE_MINUTE