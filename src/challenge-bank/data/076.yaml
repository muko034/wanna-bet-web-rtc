id: 76
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się odgadnąć wzrost gracza siedzącego po jego prawej stronie?
    (Gracz może pomylić się o 3 cm)
    Gracz, którego wzrost jest odgadywany, zapisuje go wcześniej.
  en: |-
    Will the player manage to guess the height of the player sitting to their right?
    (The player may be off by up to 3 cm)
    The player whose height is guessed writes it down beforehand.
timeLimit: NONE