id: 53
type: PHYSICAL
content:
  pl: |-
    (Zanim zadanie zostanie przeczytane gracz powinien zamknąć oczy.)
    Czy gracz jest w stanie odgadnąć, ile punktów ma do tej pory osoba po jego prawej stronie?
    Gracz może się pomylić maksymalnie o 3 punkty
  en: |-
    Before the task is read, the player should close their eyes.
    Is the player able to guess how many points the person to their right has so far?
    The player can make a mistake of a maximum of 3 points.
timeLimit: NONE