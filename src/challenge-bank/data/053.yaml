id: 53
type: PHYSICAL
content:
  pl: |-
    Czy gracz odgadnie, ile punktów ma do tej pory gracz siedzący po jego prawej stronie?
    (dopuszczalny błąd: maksymalnie 3 punkty)
    Pozostali gracze czytają zadanie, gdy gracz ma zamknięte oczy. Gracz nie otwiera oczu, dopóki nie poda odpowiedzi.
  en: |-
    Will the player guess how many points the player sitting to their right has so far?
    (allowed error: up to 3 points)
    The other players read the task while the player has their eyes closed. The player keeps their eyes closed until they give an answer.
timeLimit: NONE