id: 173
type: PHYSICAL
content:
  pl: 'Czy graczowi uda się w ciągu 15 sekund napisać w oknie wiadomości w telefonie:
    "Ząb zupa zębowa, dąb zupa dębowa."?'
  en: 'Will the player be able to write in the message window on the phone: ''Tooth
    soup tooth, oak soup oak.'' in 15 seconds?'
timeLimit: QUARTER_MINUTE