id: 130
type: MENTAL
content:
  pl: |-
    Czy graczowi uda się ułożyć 7 innych słów z liter podanego słowa w ciągu 1 minuty?
    (każdej litery można użyć tyle razy, ile razy występuje w słowie)
    Pozostali gracze wybierają jedno z poniższych słów (lub inne) przed fazą obstawiania.
    Gracz może korzystać z kartki i długopisu.
    ALIGATOR
    JASZCZURKA
    KAMELEON
  en: |-
    Will the player manage to make 7 other words from the letters of the given word within 1 minute?
    (each letter may be used as many times as it appears in the word)
    The other players choose one of the words below (or another word) before the betting phase.
    The player may use a piece of paper and a pen.
    ALLIGATOR
    ELEPHANT
    CHAMELEON
timeLimit: ONE_MINUTE