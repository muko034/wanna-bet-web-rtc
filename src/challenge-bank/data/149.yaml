id: 149
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 30 sekund ustawić wieżę z co najmniej 7 różnych przedmiotów?
    Wieża musi się utrzymać w pionie przynajmniej 5 sekund.
  en: |-
    Will the player manage to build a tower from at least 7 different items within 30 seconds?
    The tower must stay upright for at least 5 seconds.
timeLimit: HALF_MINUTE