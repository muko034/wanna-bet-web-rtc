content:
  pl: |-
    Czy graczowi uda się podrzucić łyżeczkę, leżącą na stole, tak aby trafiła do stojącego obok kubka?
    (2 udane próby z 5.)
  en: |-
    Will the player manage to toss the teaspoon, lying on the table, so that it lands in the cup standing next to it?
    2 successful attempts out of 5.
