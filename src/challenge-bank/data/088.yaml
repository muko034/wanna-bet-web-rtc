id: 88
type: MENTAL
content:
  pl: |-
    Czy gracz rozwiąże w pamięci poniższe zadanie arytmetyczne w ciągu 15 sekund?
    60% * XYZ = ?
    Przed obstawianiem pozostali gracze uzgadniają liczbę „XYZ” i zapisują działanie na kartce. Gracz może patrzeć na kartkę, ale nie może pisać.
  en: |-
    Will the player solve the arithmetic problem below in their head within 15 seconds?
    60% * XYZ = ?
    Before betting, the other players agree on the number "XYZ" and write the problem on a piece of paper. The player may look at the paper but may not write.
timeLimit: QUARTER_MINUTE