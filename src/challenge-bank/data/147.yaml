id: 147
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się podrzucić lewą ręką monetę, piłeczkę lub inny niewielki przedmiot tak, żeby dotknął sufitu, a następnie złapać go tą samą ręką?
    (3 udane próby z 5)
  en: |-
    Will the player manage to toss a coin, a ball, or another small object with their left hand so that it touches the ceiling, and then catch it with the same hand?
    (3 successful attempts out of 5)
timeLimit: NONE