id: 57
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się przez 1 minutę utrzymać kubek na zewnętrznej stronie dłoni uniesionej nad głowę, z ręką wyprostowaną w łokciu?
  en: |-
    Will the player manage to keep a cup on the back of their hand for 1 minute, with the hand raised above their head and the arm straight at the elbow?
timeLimit: ONE_MINUTE