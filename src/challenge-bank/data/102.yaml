id: 102
type: PHYSICAL
content:
  pl: Czy graczowi uda się, w ciągu 15 sekund, zdjąć swoją koszulkę / bluzę, wywinąć
    ją na lewą stronę i założyć ją ponownie?
  en: Will the player manage to take off their shirt/sweatshirt, turn it inside out,
    and put it back on within 15 seconds?
timeLimit: QUARTER_MINUTE