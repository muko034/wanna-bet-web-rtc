id: 143
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 15 sekund obejść krzesło, trzymając piłeczkę między kolanami?
    Piłeczki nie można dotykać rękoma, chyba że spadnie na podłogę. Wtedy gracz może ją podnieść, włożyć z powrotem między kolana i iść dalej.
  en: |-
    Will the player manage to walk around the chair in 15 seconds while holding a ball between their knees?
    The player must not touch the ball with their hands unless it falls to the floor. Then the player may pick it up, put it back between their knees, and keep walking.
timeLimit: QUARTER_MINUTE