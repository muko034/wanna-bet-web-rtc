id: 35
type: MENTAL
content:
  pl: |-
    Czy gracz rozwiąże w pamięci poniższe zadanie arytmetyczne w ciągu 30 sekund?
    (XYZ + ABC - 13) x 2 = ?
    Pozostali gracze zastępują litery 'XYZ' i 'ABC' dowolnymi cyframi, zapisują działanie na kartce i pokazują je graczowi.
    Gracz może patrzeć na kartkę, ale nie może nic na niej pisać.
  en: |-
    Will the player solve the following arithmetic problem in their head in 30 seconds?
    (XYZ + ABC - 13) x 2 = ?
    The other players replace the letters 'XYZ' and 'ABC' with any digits, write the problem on a piece of paper, and show it to the player.
    The player may look at the paper but may not write anything on it.
timeLimit: HALF_MINUTE