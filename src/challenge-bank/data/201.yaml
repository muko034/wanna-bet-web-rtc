id: 201
type: MENTAL
content:
  pl: |-
    Czy gracz w 30 sekund wymieni 5 państw, których stolica zaczyna się na tę samą literę co nazwa państwa?
    (na przykład: Szwecja – Sztokholm)
  en: |-
    Will the player name 5 countries whose capital starts with the same letter as the country in 30 seconds?
    (for example: Sweden – Stockholm)
timeLimit: HALF_MINUTE
