id: 86
type: MENTAL
content:
  pl: |-
    Czy gracz w ciągu 30 sekund rozwiąże w pamięci poniższe zadanie arytmetyczne?
    XYZ + ABC / 2 = ?
    Przed obstawianiem pozostali gracze uzgadniają liczby "XYZ" i "ABC" oraz zapisują działanie na kartce.
    Gracz może patrzeć na kartkę, ale nie może pisać.
  en: |-
    Will the player solve the following arithmetic problem in their head within 30 seconds?
    XYZ + ABC / 2 = ?
    Before betting, the other players agree on the numbers "XYZ" and "ABC" and write the problem on a sheet of paper.
    The player can look at the paper but cannot write.
timeLimit: HALF_MINUTE