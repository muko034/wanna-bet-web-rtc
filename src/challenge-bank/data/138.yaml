id: 138
type: MENTAL
content:
  pl: |-
    Czy graczowi uda się, w ciągu 30 sekund, stworzyć 5 innych słów, używając liter z podanego słowa?
    Pozostali gracze wybierają jedno z poniższych słów (bądź inne) przed fazą obstawiania. Gracz ma do dyspozycji kartkę i długopis w trakcie wykonywania zadania.
    MASKARADA
    PRZESTĘPSTWO
    EUTROFIZACJA
  en: |-
    Will the player be able to create 5 other words within 30 seconds using the letters from the given word?
    The other players choose one of the words below (or another) before the betting phase.
    The player has a sheet of paper and a pen at their disposal while completing the task.
    MASQUERADE
    CONSIDERATION
    EUTROPHICATION
timeLimit: HALF_MINUTE