id: 179
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się bezbłędnie zapisać słownie liczbę 6-cyfrową?
    Liczbę zapisuje na kartce jeden z pozostałych graczy.
  en: |-
    Will the player manage to write a 6-digit number in words without mistakes?
    One of the other players writes the number on a piece of paper.
timeLimit: HALF_MINUTE