id: 48
type: MENTAL
content:
  pl: |-
    Czy gracz, w ciągu 30 sekund, rozwiąże w pamięci poniższe zadanie arytmetyczne?
    XY x Z - 1234 = ?
    (Osoba, która czyta zadanie powinna zastąpić litery "XYZ" dowolnymi cyframi, spisać je na kartce i pokazać graczowi wykonującemu zadanie. Ten może patrzeć się na kartkę, ale nie może ni na niej pisać.)
  en: |-
    Will the player solve the following arithmetic problem in their head within 30 seconds?
    XY x Z - 1234 = ?
    The person reading the task should replace the letters 'XYZ' with any digits, write them down on a piece of paper, and show them to the player completing the task.
    This one can look at the page, but cannot write on it.
timeLimit: HALF_MINUTE