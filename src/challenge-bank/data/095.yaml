id: 95
type: MENTAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 1 minuty podać 8 nowych słów z liter jednego słowa wybranego z poniższej listy?
    (Wszystkie nowe słowa muszą coś oznaczać. Gracz ma do dyspozycji kartkę i długopis.)
    ASTRONOMICZNY
    NIEPEWNY
    TEATRALNE
    KLEPTOMAN
  en: |-
    Will the player manage to name 8 new words within 1 minute, using the letters of one word chosen from the list below?
    (All new words must mean something. The player has a piece of paper and a pen.)
    ASTRONOMICAL
    REVOLUTIONARY
    THEATRICAL
    KLEPTOMANIAC
timeLimit: ONE_MINUTE