id: 108
type: PHYSICAL
content:
  pl: |-
    Czy graczowi uda się w ciągu 1 minuty zapisać swoje nazwisko w lustrzanym odbiciu?
    Gracz ma do dyspozycji wyłącznie kartę i długopis.
  en: |-
    Will the player manage to write their surname as a mirror image within 1 minute?
    The player may use only a card and a pen.
timeLimit: ONE_MINUTE