<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Wanna Bet</title>
    <script type="text/javascript">
      // GitHub Pages has no server-side rewrites, so unmatched paths land here. Redirect back to
      // the app root with the original path packed into the query string; index.html restores it.
      var pathSegmentsToKeep = 1; // /<repo>/ prefix to preserve for a GitHub Pages project site

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
